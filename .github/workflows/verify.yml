name: Verify Curb

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and API checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.0', '26.x']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:replay
      - name: Verify compiled pages, API, report photos and media
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3004 > "$RUNNER_TEMP/curb-server.log" 2>&1 &
          curb_server_pid=$!
          trap 'kill "$curb_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3004/api/ready > /dev/null; then
              break
            fi
            if ! kill -0 "$curb_server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/curb-server.log"
              exit 1
            fi
            sleep 1
          done
          node --import tsx scripts/curb/verify_deployment.ts http://127.0.0.1:3004 "$APP_REVISION"
          node --import tsx scripts/curb/audit_hosted_backend.ts http://127.0.0.1:3004 "$APP_REVISION"
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/curb-server.log" 2>/dev/null || true
